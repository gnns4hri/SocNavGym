# Example for the vision system: the benchmark's dynamics (sn26lab/bench/open.yaml) in a furnished, walled room with people,
# and a robot that carries an RGB-D camera on a pan-tilt head and a 2D lidar (the `vision:` section at the end).
rendering:
    resolution_y: 1080  # size of the canvas in rows
    resolution_x: 1080  # size of the canvas in columns
    milliseconds: 30  # delay parameter for rendering

episode:
    episode_length: 500  # maximum steps in an episode
    time_step: 0.1  # number of seconds that one step corresponds to
    end_with_collision: True # episode end with collision
    continue_after_reach: True   # True: after reaching the goal the episode goes on until the robot stops getting closer to it (rates below)
    settle_position_rate: 0.01  # m/s: approaching the goal position slower than this counts as not getting closer
    settle_rotation_rate: 0.1745  # rad/s (10 degrees/s): the same for the goal orientation

robot:
    robot_radius: 0.25  # radius of the robot
    robot_shape: "circle"  # the robot's body: "circle" (robot_radius) or "rectangle" (robot_length x robot_width); every algorithm reads it (sn26lab/limits.py)
    # robot_length: 0.65  # with robot_shape "rectangle": size along the heading (m)
    # robot_width: 0.40   # with robot_shape "rectangle": size across the heading (m)
    goal_radius: 0.5  # radius of the goal
    goal_radius_margin: 0.3
    robot_type: "holonomic"  # there are two types, diff-drive or holonomic
    min_advance_robot: -0.5  # minimum linear speed for the robot
    max_advance_robot: 1.0  # maximum linear speed for the robot
    max_rotation: 2.141592653589793  # maximum rotational speed for robot
    max_linear_speed: 1.0  # cap on |(vx, vy)| in m/s (benchmark v2.1, 2026-11-09); rotation is capped by max_rotation (rad/s)
    max_lateral_speed: 0.2  # cap on |vy| in m/s (benchmark v2.2, 2026-11-09)
    min_goal_orientation_threshold: 0.20
    max_goal_orientation_threshold: 0.75



human:
    human_diameter: 0.72  # diameter of the human
    human_goal_radius: 0.25  # radius of human's goal
    human_policy: {orca: 0.5, sfm: 0.5}  # policy of the human. Can be "random", "sfm", or "orca"
    gaze_angle: 3.14159  # gaze value for humans would be set to 1 when the robot lies between -gaze_angle/2 and +gaze_angle/2
    fov_angle: 6.2831853  # the frame of view for humans
    prob_to_avoid_robot: 0.5  # the probability that the human would consider the robot in it's policy
    max_advance_human: 0.3  # maximum speed for humans
    speed_range: [0.3, 1.1]  # per-human preferred walking speed (all policies)
    max_rotation_human: 1.57 # maximum rotation speed for humans
    speed_threshold: 0.05  # speed below which would be considered 0 (for humans)

laptop:
    laptop_width: 0.26  # width of the laptop
    laptop_length: 0.40  # length of the laptop

plant:
    plant_radius: 0.3  # radius of the plant

table:
    table_width: 1.  # width of the tables
    table_length: 1.5  # length of the tables

chair:
    chair_width: 0.4  # width of the chair
    chair_length: 0.35  # length of the chair

wall:
    wall_thickness: 0.2  # thickness of the walls
    wall_segment_size: -1  # If it's < 0, we take it as it is

human-human-interaction:
    interaction_radius: 0.72  # interaction radius
    interaction_goal_radius: 1.44  # interaction goal radius
    noise_variance: 0.005  # a random noise of normal(0, noise_variance) is applied to the humans' speed received by ORCA.

human-laptop-interaction:
    human_laptop_distance: 0.3  # distance between human and laptop

env:
    margin: 0.5  # margin for the env
    speed_threshold: 0.05  # speed below which would be considered 0 (for humans)
    crowd_dispersal_probability: 0.0  # probability of crowd dispersal
    human_laptop_dispersal_probability: 0.0  # probability to disperse a human-laptop-interaction
    crowd_formation_probability: 0.0  # probability of crowd formation
    human_laptop_formation_probability: 0.0  # probability to form a human-laptop-interaction

    # Path to custom-reward file: "dsrnn", "sparse_gotopoint", "sn26"
    reward_file: "sn26gnn"
    cuda_device: 0  # cuda device to use (in case of multiple cuda devices). If cpu or only one cuda device, keep it as 0

    min_static_humans: 1  # minimum no. of static humans
    max_static_humans: 2  # maximum no. of static humans

    min_dynamic_humans: 3  # minimum no. of dynamic humans
    max_dynamic_humans: 4  # maximum no. of dynamic humans

    min_tables: 2  # minimum no. of tables
    max_tables: 2  # maximum no. of tables

    min_plants: 2  # minimum no. of plants
    max_plants: 2  # maximum no. of plants

    min_laptops: 1  # minimum no. of laptops
    max_laptops: 2  # maximum no. of laptops

    min_chairs: 2  # minimum no. of chairs
    max_chairs: 3  # maximum no. of chairs

    min_h_h_dynamic_interactions: 1  ## 2  # minimum no. of dynamic human-human interactions in the env. Note that these crowds can disperse if the parameter crowd_dispersal_probability is greater than 0
    max_h_h_dynamic_interactions: 1 ## 2  # maximum no. of dynamic human-human interactions in the env. Note that these crowds can disperse if the parameter crowd_dispersal_probability is greater than 0

    min_h_h_dynamic_interactions_non_dispersing: 0  # minimum no. of dynamic human-human interactions in the env. Note that these crowds never disperse, even if the parameter crowd_dispersal_probability is greater than 0
    max_h_h_dynamic_interactions_non_dispersing: 0  # maximum no. of dynamic human-human interactions in the env. Note that these crowds never disperse, even if the parameter crowd_dispersal_probability is greater than 0

    min_h_h_static_interactions: 1  # minimum no. of static human-human interactions in the env. Note that these crowds can disperse if the parameter crowd_dispersal_probability is greater than 0
    max_h_h_static_interactions: 1  # maximum no. of static human-human interactions in the env. Note that these crowds can disperse if the parameter crowd_dispersal_probability is greater than 0

    min_h_h_static_interactions_non_dispersing: 0  # minimum no. of static human-human interactions in the env. Note that these crowds never disperse, even if the parameter crowd_dispersal_probability is greater than 0
    max_h_h_static_interactions_non_dispersing: 0  # minimum no. of static human-human interactions in the env. Note that these crowds never disperse, even if the parameter crowd_dispersal_probability is greater than 0

    min_human_in_h_h_interactions: 2  # minimum no. of humans in a human-human interaction
    max_human_in_h_h_interactions: 3  # maximum no. of humans in a human-human interaction

    min_h_l_interactions: 1  # minimum number of human-laptop interactions. Note that these human laptop interactions may disperse when the parameter human_laptop_dispersal_probability is greater than 0
    max_h_l_interactions: 1  # maximum number of human-laptop interactions. Note that these human laptop interactions may disperse when the parameter human_laptop_dispersal_probability is greater than 0

    min_h_l_interactions_non_dispersing: 0  # minimum number of human-laptop interactions. Note that these human laptop interactions never disperse, even when the parameter human_laptop_dispersal_probability is greater than 0
    max_h_l_interactions_non_dispersing: 0  # minimum number of human-laptop interactions. Note that these human laptop interactions never disperse, even when the parameter human_laptop_dispersal_probability is greater than 0

    get_padded_observations: False  # flag value that indicates whether you require padded observations or not. You can change it using env.set_padded_observations(True/False)

    set_shape: "square"  # can be "random", "square", "rectangle", "L" or "no-walls"
    add_corridors: False  # True or False, whether there should be corridors in the environment. Corridors cannot be added for L shaped rooms

    min_map_x: 10  # minimum size of map along x direction
    max_map_x: 10  # maximum size of map along x direction

    min_map_y: 10  # minimum size of map along y direction
    max_map_y: 10  # maximum size of map along y direction

    min_area:  60

# ---------------------------------------------------------------------------------------------------------------------
# Vision (socnavgym/vision/README.md). Without this section, or with no sensor and no viewer in it, the environment is
# exactly as before. Every field but a sensor's `type` and `link` is optional.
vision:
    robot:
        urdf: round_pan_tilt_robot            # the 3D model: a name in socnavgym/vision/robots - round_pan_tilt_robot (round, radius 0.25 m) or
                                        # box_pan_tilt_robot (rectangular, 0.65 x 0.40 m: with robot_shape "rectangle" above) - or a path
                                        # (absolute, or relative to this file). Left out: round or box as robot_shape says
        joints: {head_pan: 0.0, head_tilt: 0.15}     # starting positions (rad); joints not named start at 0
    sensors:
        camera:                         # the name the readings get in obs["sensors"]
            type: rgbd
            link: camera_link           # the URDF link it is attached to (it looks along the link's +X, +Z up)
            # model: realsense_d435     # default; fields below override the model's values
            # width: 640
            # height: 480
            # hfov: 69.0                # degrees
        scan:
            type: lidar
            link: lidar_link
            mode: simple                # simple: against the simulator's 2D shapes (fast, no renderer); mesh: against the 3D models
    ground_truth: true                  # adds segmentation, instance ids and the sensor's pose to every sensor's readings
    display: false                      # true: the sensors' windows are open from the start (the "Windows" menu of the 2D window shows and hides them)
    viewer:
        enabled: true                   # a 3D view of the scene: env.vision.view() gives its image; env.render() shows it in a movable window
        # its picture and window have the size of `rendering: resolution_x, resolution_y` above (a quarter of the pixels renders about 4 times faster)
        # starts from straight above, framed on everything in the scene (it widens if the robot leaves the map); see the README for
        # azimuth, elevation, fit, margin, distance, target, follow
    renderer:
        samples: 24                     # light samples per pixel: more = cleaner and slower
        # device: auto                  # auto | optix | cuda | hip | metal | oneapi | cpu
        # required: false               # false: without the renderer installed, a warning and the simulation in 2D; true: an error
